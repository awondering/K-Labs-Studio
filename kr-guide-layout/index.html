<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KR Guide Layout · K-Labs Studio</title>
<style>
/* KR Guide Layout: styled to K-Labs Studio tokens (theme.css / layout.css / components.css, read 2026-11-15).
   Token names below are this tool's own; values are Studio's. Studio rules adapted, not copied wholesale:
   carbon-field texture, card gradient + 18px radius, circular +/- steppers with a weight-800 value, 16px-radius
   primary/ghost buttons, red hover/focus rule, 410px shell. Keep class names stable: browser-tests.py depends on them. */
:root{--bg:#060708;--card:#0d1012;--card2:#12161a;--line:#242a2d;--ti:#ddd6c9;--ti2:#ada99d;--mut:#6f736d;
--red:#b42736;--red2:#e14a58;--warn:#c9a24a;--warn-line:#5b4a1e;--bad:#e14a58;
--mi:'Michroma','Eurostile','Arial Narrow',sans-serif;--sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;color:var(--ti);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%;min-height:100vh;
background:radial-gradient(circle at 50% -10%,rgba(180,39,54,.10),transparent 45%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:screen;background-size:12px 12px;
background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 1px,transparent 1px 6px)}
main{position:relative;max-width:410px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
h1{font:400 15px/1.3 var(--mi);letter-spacing:.06em;margin:8px 2px 2px}
h2{font:400 11px/1.3 var(--mi);letter-spacing:.08em;margin:0 0 10px;color:var(--ti2);text-transform:uppercase}
.sub{color:var(--mut);font-size:12.5px;margin:0 2px 12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.mut{color:var(--mut);font-size:12.5px}.note{color:var(--mut);font-size:12px;margin:8px 0 0}
.note b,.mut b{color:var(--ti2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:380px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;color:var(--mut)}
/* stepper: Studio layout-control-card pattern (circular buttons, weight-800 value) */
.num{display:flex;align-items:center;gap:6px;margin-top:4px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:3px}
.num input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ti);text-align:center;font:800 16px var(--sans);font-variant-numeric:tabular-nums;padding:0 2px;height:40px}
.num button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ti);font:400 20px var(--sans);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.num button:active{background:rgba(180,39,54,.22)}
@media(hover:hover){.num button:hover,.btn:hover,.seg button:hover,.row .ac button:hover{border-color:var(--red);color:var(--red2)}}
input:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.num:focus-within{border-color:var(--red)}
.seg{display:flex;gap:4px;margin-top:6px;padding:3px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.seg button{flex:1;height:38px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--mut);font:600 13px var(--sans);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--red),#8f1e2b);border-color:var(--red2);color:#f4efe6}
.btn{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:var(--card2);color:var(--ti);font:600 13.5px var(--sans);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.btn.pri{background:linear-gradient(180deg,var(--red),#8f1e2b);border-color:var(--red2);color:#f4efe6}
@media(hover:hover){.btn.pri:hover,.seg button[aria-pressed=true]:hover{color:#fff;border-color:var(--red2)}}
.btn.sm{height:38px;padding:0 12px;font-size:12.5px;border-radius:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.warn{border-color:var(--warn-line);background:linear-gradient(180deg,#171409,#100f09)}.warn h2{color:var(--warn)}.warn p{margin:0 0 6px;font-size:13.5px}
.err{color:var(--bad);font-size:12.5px;margin:6px 0 0}
details>summary{cursor:pointer;color:var(--ti2);font-size:13.5px;padding:8px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"\25BE";color:var(--mut)}details[open]>summary::after{content:"\25B4"}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font:8px var(--sans)}svg .g{cursor:pointer}
svg .sel text{fill:var(--ti)}
/* guide rows: Studio guide-spacing-panel pattern */
.hd,.row{display:grid;grid-template-columns:78px 1fr 40px 52px;gap:5px;align-items:center}
.hd{color:var(--mut);font-size:11.5px;padding:0 4px 4px}.hd span:nth-child(3){text-align:right}
.row{padding:6px 4px;border-top:1px solid var(--line);border-left:3px solid transparent;border-radius:0}
.row.sel{background:rgba(180,39,54,.10);border-left-color:var(--red2)}.row.lk .num{border-color:#3a4247}
.row .id b{font-weight:800}.row .id span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{margin:0;padding:2px;gap:3px;border-radius:12px}.row .num input{height:34px;font-size:14px;padding:0}.row .num button{width:34px;height:34px;font-size:18px}
.row .sp{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ti2)}
.row .ac{display:flex;flex-direction:column;gap:3px}.row .ac button{height:26px;border:1px solid var(--line);border-radius:999px;background:var(--card2);color:var(--ti2);font:600 11px var(--sans);cursor:pointer;transition:border-color .15s,color .15s}
.row .ac button[aria-pressed=true]{background:rgba(180,39,54,.22);border-color:var(--red);color:var(--ti)}
.tag{font-style:normal;font-size:10px;margin-left:5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tag.manual,.tag.added{color:var(--ti);border-color:#4b5154}.tag.experimental,.tag.heuristic{color:var(--warn);border-color:var(--warn-line)}.tag.published{color:var(--mut)}
.tag.off{color:var(--bad);border-color:#5b2a2a}
.sel-info{font-size:12.5px;color:var(--mut);margin:8px 2px 0;font-variant-numeric:tabular-nums}.sel-info b{color:var(--ti)}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:13.5px}.chk input{width:22px;height:22px;accent-color:var(--red)}
input.tin{display:block;width:100%;margin-top:4px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ti);padding:0 10px;font:600 15px var(--sans)}
input.tin:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
textarea{width:100%;min-height:140px;background:var(--card);color:var(--ti);border:1px solid var(--line);border-radius:12px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.btn.sm[aria-pressed=true]{background:linear-gradient(180deg,var(--red),#8f1e2b);border-color:var(--red2);color:#f4efe6}
.btn:disabled,.row .ac button:disabled{opacity:.4;cursor:default}
@media(max-width:420px){main{padding-left:10px;padding-right:10px}.card{padding:12px;border-radius:16px}.btn.sm{flex:1 1 auto}}
/* Narrow phones (about 360 px, and the hosted width inside the Workshop): keep every guide row's position field readable. Layout only. */
@media(max-width:400px){.hd,.row{grid-template-columns:70px 1fr 34px 46px;gap:3px}.row .tag{font-size:9.5px;padding:1px 5px}.row .num{gap:1px}.row .num button{width:30px;font-size:16px}.row .id span{font-size:10.5px}.row .sp{font-size:11.5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* roles, legend, summary, desktop layout */
.r-stripper{--rc:#e14a58}.r-reduction{--rc:#b42736}.r-choke{--rc:#ada99d}.r-running{--rc:#7f9aa6}.r-tip-top{--rc:#ddd6c9}
.row .id b[class^=r-]{border-left:4px solid var(--rc);padding-left:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rc);margin-right:6px;flex:none}
.r-tip-top.dot{background:transparent;border:2px solid var(--rc);width:6px;height:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}.legend span{display:inline-flex;align-items:center}
.sl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}.sl:first-child{border-top:0}
.sl b{min-width:112px}.sl span:not(.dot){color:var(--mut)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 56px}
.notice{border:1px solid var(--warn-line);border-radius:14px;padding:2px 12px;margin:0 0 10px;background:linear-gradient(180deg,#171409,#100f09)}.notice summary{color:var(--warn);font-size:13px}
.notice .note{margin:0 0 8px}
.row .id .tag{display:block;width:max-content;margin:2px 0 0;font-size:9px;padding:0 5px}
@media(max-width:400px){.row .id .tag{font-size:8.5px;padding:0 4px}}

.about{border:1px solid var(--line);border-radius:14px;padding:2px 12px;margin:10px 0 0;background:var(--card)}
.about summary{padding:10px 0;font-size:13px;color:var(--mut)}.about .note{margin:0 0 8px}
.seg.wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0;border:0;background:transparent}
.seg.wrap button{height:44px;border:1px solid var(--line);background:var(--card);flex:none}
.seg.wrap button[aria-pressed=true]{border-color:var(--red2)}

/* ---- layout: one column on phones; tablet and desktop compose rod/reel as a bar over a preview column and a decisions column ---- */
#app{display:flex;flex-direction:column}
.colL,.colR{display:contents}
#app>h1,#app>.sub{order:0}.s-rod{order:1}.s-warn{order:2}.s-sum{order:3}.s-dia{order:4}.s-gui{order:5}.s-sta{order:6}.s-src{order:7}#app>.about{order:8}
.rr-opt{grid-column:1/-1}
@media(min-width:600px) and (max-width:899px){main{max-width:720px}.seg.wrap{grid-template-columns:repeat(8,1fr)}.rr-dims{grid-template-columns:1fr 1fr}}
@media(min-width:900px){
  main{max-width:1120px;padding-left:20px;padding-right:20px}
  h1{font-size:17px}
  #app{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:14px;align-items:start}
  #app>*{order:0}
  #app>h1,#app>.sub,.s-rod,#app>.about{grid-column:1/-1}
  .colL,.colR{display:flex;flex-direction:column;min-width:0}.colL{grid-column:1}.colR{grid-column:2}
  .card{margin-bottom:12px}
  .rodreel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.4fr) minmax(0,.85fr);gap:4px 20px;align-items:end;padding:14px 18px}
  .rodreel>h2,.rr-opt{grid-column:1/-1}.rodreel>h2{margin-bottom:6px}
  .rr-rod{min-width:0}.seg.wrap{grid-template-columns:repeat(8,1fr);gap:5px}.seg.wrap button{height:40px;font-size:12.5px;padding:0}
  .rr-dims{grid-template-columns:1fr 1fr;margin:0!important}.rr-units{margin:0 0 1px;align-self:end}.rr-units button{height:36px;font-size:12px;padding:0 4px}
  .rodreel .num{max-width:none}
  .rr-opt{margin-top:2px}.rr-opt summary{padding:6px 0}
  .s-dia svg{max-height:230px}
  /* guide table: compact, aligned rows; tag beside the label, lock/ref side by side */
  .hd,.row{grid-template-columns:112px minmax(0,1fr) 64px 108px;gap:10px}
  .row{padding:4px 6px}.row .id{display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:center}
  .row .id b[class^=r-]{grid-row:1;grid-column:1}.row .id .tag{grid-row:1;grid-column:2;margin:0;justify-self:start}.row .id span{grid-column:1/-1;font-size:10.5px}
  .row .num{max-width:300px;justify-self:center;width:100%}.row .num input{height:32px}.row .num button{width:32px;height:32px}
  .row .ac{flex-direction:row;gap:6px}.row .ac button{flex:1;height:28px}
  .row .sp{font-size:13px}
}
@media(min-width:1280px){main{max-width:1200px}}

.row .sp{white-space:nowrap}
@media(max-width:400px){.u-frac .hd,.u-frac .row{grid-template-columns:60px 1fr 48px 44px}.u-frac .row .num input{font-size:13px}.u-frac .row .sp{font-size:10.5px}}

</style></head>

<script>
/* Fuji KR Concept spinning guide-placement chart, eight rows (5'6" to 9'), transcribed by K-Labs.
   Source: the three-page chart PDF supplied by the builder (Merrick Tackle copy, undated). Text layer read 2026-11-14 and checked against the
   chart drawings (rendered at 220 dpi) 2026-11-15; see ../VERIFICATION.md for what was verified, the discrepancies inside the chart, and what is
   still unverified. Values are inches as printed and have not been altered.
   Fields: rod, label = guide count INCLUDING the tip-top, stripperTable (table A), stripperDiagram (distance used for the layout),
   choke (table B: stem-side distance to the choke guide), g2 and g3 (tables C and D), gaps (runner and reduction gaps, stripper to tip-top),
   sizes (ring sizes in mm per guide), kb and kt (counts as drawn). This is Fuji's data, not a K-Labs specification; K-Labs Studio is not
   affiliated with or endorsed by Fuji. This file is the only place the chart values live. */
(function (root) {
  const R = (rod, label, stripperTable, stripperDiagram, choke, g2, g3, gaps, sizes, kb, kt) => ({ rod, label, stripperTable, stripperDiagram, choke, g2, g3, gaps, sizes, kb, kt });
  const rows = [
    R("5'6\"", 8, 21.6, 21.6, 17.5, 7.2, 5.5, [7.2, 5.5, 4.7, 4.5, 4.3, 3.9, 3.5], [16, 8, 5.5, 4, 4, 4, 4, 4], 1, 3),
    R("6'", 8, 23.6, 23.6, 20.2, 8.4, 6.2, [8.4, 6.2, 5.5, 5.3, 5.1, 4.5, 3.5], [20, 10, 5.5, 4, 4, 4, 4, 4], 1, 3),
    R("6'6\"", 9, 25.6, 25.5, 21.6, 9, 6.6, [9, 6.6, 5.9, 5.3, 5.1, 4.7, 4.3, 3.9], [20, 10, 5.5, 4, 4, 4, 4, 4, 4], 1, 4),
    R("7'", 10, 27.5, 27.5, 21.6, 9, 6.6, [9, 6.6, 5.9, 5.3, 4.9, 4.5, 4.3, 4.3, 3.9], [25, 12, 5.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5], 1, 5),
    R("7'6\"", 10, 29.5, 29.5, 22.4, 9, 7, [9, 7, 6.2, 5.9, 5.5, 5.1, 4.7, 4.3, 3.9], [25, 12, 5.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5], 2, 4),
    R("8'", 11, 31.4, 31.4, 22.6, 9.4, 7, [9.4, 7.0, 6.1, 5.5, 5.1, 4.7, 4.3, 3.9, 3.9, 3.5], [25, 12, 5.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5], 2, 5),
    R("8'6\"", 11, 31.4, 31.4, 23.8, 9.8, 7.4, [9.8, 7.4, 6.4, 5.9, 5.5, 5.1, 4.7, 4.3, 3.9, 3.9], [25, 12, 5.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5], 3, 4),
    R("9'", 11, 31.4, 31.4, 24.6, 10.2, 7.4, [10.2, 7.4, 6.8, 6.2, 5.9, 5.5, 5.1, 4.7, 4.3, 3.9], [25, 12, 5.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5], 3, 4)
  ];
  const data = { rows, envelope: { minGapIn: 3.5, maxGapIn: 6.2 } };
  if (typeof module !== 'undefined' && module.exports) module.exports = data; else root.KR_CHART_DATA = data;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* K-Labs KR Concept calculator engine. Pure functions, no DOM. Positions in mm, measured from the
   blank tip end to the guide RING CENTRE projected on the blank axis. Ring-centre-to-foot offsets are
   NOT modelled (unverified); never use these numbers to mark foot placement. */
(function (root) {
  'use strict';
  const IN = 25.4, MIN_GAP = 15, FIT_TOL = 1.3; // 1.3 mm = chart precision (+/-0.05 in)
  const toMm = (v, u) => (u === 'mm' ? v : v * IN);
  const fromMm = (mm, u) => (u === 'mm' ? mm : mm / IN);
  function frac(i, den) { // conventional inch fraction, reduced; 1/16 for positions, 1/32 where a limit must not be misstated
    den = den || 16; const neg = i < 0; let a = Math.abs(i), w = Math.floor(a), n = Math.round((a - w) * den);
    if (n === den) { w++; n = 0; }
    let s = ''; if (n) { let d = den, k = n; while (k % 2 === 0) { k /= 2; d /= 2; } s = k + '/' + d; }
    return (neg ? '-' : '') + ((w || !s ? String(w) : '') + (w && s ? ' ' : '') + s) + '"';
  }
  const fmt = (mm, u) => (u === 'mm' ? mm.toFixed(1) : u === 'frac' ? frac(mm / IN) : (mm / IN).toFixed(2));
  // Unit used for the engine's own wording (warnings, reasons, limits). Geometry is always millimetres; this only changes how it is written.
  let UNIT = 'mm';
  const setUnit = u => { UNIT = u === 'in' || u === 'frac' ? u : 'mm'; };
  const len = mm => (UNIT === 'mm' ? mm.toFixed(1) + ' mm' : UNIT === 'frac' ? frac(mm / IN, 32) : (mm / IN).toFixed(2) + ' in');

  // Reference layouts come from Fuji's published KR Concept chart rows (chart-data.js, transcribed by K-Labs, see VERIFICATION.md).
  // A row gives the reel-stem-to-stripper distance and the gap between every following guide down to the tip-top; the layout is those
  // distances laid onto the builder's blank from the reel stem. The chart's choke-distance table is kept only as a separate cross-check.
  const CHART = typeof module !== 'undefined' && module.exports ? require('./chart-data.js') : root.KR_CHART_DATA;
  const rodInches = rod => { const m = /^(\d+)'(?:(\d+)")?$/.exec(rod); return m ? +m[1] * 12 + (m[2] ? +m[2] : 0) : NaN; };
  const CHART_RODS = CHART.rows.map(r => ({ id: r.rod, label: r.rod, lengthMm: rodInches(r.rod) * IN }));
  const DEFAULT_ROD = "7'";
  const CHART_ENVELOPE = { minGapIn: CHART.envelope.minGapIn, maxGapIn: CHART.envelope.maxGapIn, verified: true,
    definition: 'gaps after the choke guide; counting the #3-to-#4 transition gap as well would raise the maximum to 6.8 in (a builder-side definition, the chart does not state which is meant)',
    source: 'Smallest and largest gap after the choke guide across all eight rows of the chart; every row narrows toward the tip' };
  // Guide models follow the chart's labels (KL-H reduction guides, KB choke and further KB, KT running guides, LG tip-top) with the chart's ring sizes in mm.
  function referenceForRod(rod) {
    const r = CHART.rows.find(x => x.rod === rod); if (!r) return null;
    const n = r.gaps.length + 1, sz = r.sizes;
    const models = Array.from({ length: n }, (_, i) => (i < 2 ? 'KL' + sz[i] + 'H' : i === 2 ? 'KL' + sz[i] : i < 3 + r.kb ? 'KB' + sz[i] : i === n - 1 ? 'LG' + sz[i] : 'KT' + sz[i]));
    const guides = models.map((model, i) => ({ role: i === 0 ? 'stripper' : i < 3 ? 'reduction' : i === 3 ? 'choke' : i === n - 1 ? 'tip-top' : 'running', model }));
    guides[2].unverified = true; guides[2].unverifiedNote = 'third KR reduction guide; chart groups it with KL-H guides but gives no individual frame designation';
    return { id: 'kr-' + rod, rod, label: 'Fuji KR Concept chart, ' + rod, chart: true,
      source: 'Fuji KR Concept spinning guide-placement chart, ' + rod + ' row, as transcribed by K-Labs. Not an official Fuji specification of this tool.',
      stripperIn: r.stripperDiagram, gapsIn: r.gaps.slice(),
      chokeTable: { stripperIn: r.stripperTable, chokeBeyondIn: r.choke, g2In: r.g2, g3In: r.g3 },
      sourceCount: { label: r.label, includesTipTop: true }, envelope: Object.assign({}, CHART_ENVELOPE), guides };
  }
  const MAX_ENTRY_GUIDES = 24, MIN_ENTRY_GUIDES = 5;
  // Builds a reference from the builder's own chart measurements (pure). e = { label, unit: 'mm' | 'in', stripper, gaps: [..], models?: [..],
  // chokeBeyond?, envelopeMin?, envelopeMax? } with lengths in the stated unit. Guide roles follow the KR-style train (stripper, two further
  // reduction guides, choke guide, running guides, tip-top); that role order is an assumption of this tool and is stated in the interface.
  function referenceFromEntry(e) {
    const bad = msg => ({ ok: false, msg });
    if (!e || typeof e !== 'object') return bad('Nothing entered');
    const k = e.unit === 'mm' ? 1 / IN : 1, num = v => (typeof v === 'number' ? v : parseFloat(v));
    const stripperIn = num(e.stripper) * k;
    if (!(stripperIn > 0) || !isFinite(stripperIn)) return bad('Enter the stripper distance (reel stem to the first guide) as a positive number');
    const gaps = (Array.isArray(e.gaps) ? e.gaps : []).map(num);
    if (gaps.length + 1 < MIN_ENTRY_GUIDES) return bad('Enter at least ' + (MIN_ENTRY_GUIDES - 1) + ' gaps (a stripper, two more reduction guides, a choke guide and a tip-top)');

<details><summary>Counts compared</summary>${as.candidates.map(k => `<p class="note">${k.n} + tip-top \u00b7 ${k.level === 'impossible' ? 'impossible: ' + k.why : (k.level === 'suitable' ? 'suitable. ' : 'manual review (' + k.review.findings.length + ' finding' + (k.review.findings.length > 1 ? 's' : '') + '). ') + sum(k)}</p>`).join('')}<p class="note">Three separate checks. Geometry: every guide on the blank, in order, at least ${K.len(K.MIN_GAP)} apart. Spacing: each runner gap within the smallest\u2013largest runner gap the chart publishes for any rod (${f(as.candidates.find(k => k.review) ? as.candidates.find(k => k.review).review.envelope[0] : 0)}\u2013${f(as.candidates.find(k => k.review) ? as.candidates.find(k => k.review).review.envelope[1] : 0)}${U}, \u00b1${f(K.PREC)}${U} chart rounding) and narrowing toward the tip. Only counts passing both are recommended.</p></details>` : ''}
${cv && cv.runners ? `<p class="note"><b>${cv.n} + tip-top \u2014 ${cv.level === 'impossible' ? 'impossible' : cv.level === 'review' ? 'manual review, not recommended' : 'suitable'}</b>${cv.level === 'impossible' ? ': ' + cv.why : ' \u00b7 ' + sum(cv)}</p>
${cv.level === 'review' ? cv.review.findings.slice(0, 3).map(fd => `<p class="note">${findTxt(fd)}</p>`).join('') + (cv.review.findings.length > 3 ? `<p class="note">+${cv.review.findings.length - 3} more.</p>` : '') : ''}
${cv.status === 'valid' ? `<p class="note">Gaps from the tip: ${cv.gapsMm.map((g, i) => f(g) + (cv.flags[i] === 'high' ? '\u2191' : cv.flags[i] === 'low' ? '\u2193' : '')).join(' \u00b7 ')}${U}. \u2191 above, \u2193 below this row\u2019s published range. Reduction train and locked/manual guides unchanged.</p>` : ''}
<div class="bar"><button class="btn sm${cv.level === 'suitable' ? ' pri' : ''}" data-candapply ${cv.status === 'valid' ? '' : 'disabled'}>${cv.level === 'review' ? 'Apply ' + cv.n + ' for manual review' : 'Apply ' + cv.n + ' + tip-top'}</button><button class="btn sm" data-candcancel>Cancel preview</button></div>` : rec ? `<div class="bar"><button class="btn sm" data-cand="${rec.n}">Preview ${rec.n} + tip-top</button></div>` : ''}
<p class="note">K-Labs calculation, not a manufacturer recommendation. Starting recommendation only. Changing the guide count changes blank support and tip spacing: verify by static-load and cast testing.</p>` : `<p>The chart reference needs <b>${f(L.refTotalMm)}${U}</b> from stem to tip-top; this blank gives <b>${f(L.stemToTip)}${U}</b> (${f(Math.abs(g.deltaMm))}${U} ${g.deltaMm < 0 ? 'short' : 'spare'}). ${L.auto ? `Showing a <b>K-Labs-calculated</b> layout: ${L.auto.n} guides + tip-top (the reference has ${L.auto.referenceBlank} + tip-top). Stripper, reduction and choke keep the chart distances from the stem; the running guides and tip-top are recalculated. This is a K-Labs calculation, not a manufacturer recommendation.` : 'The working layout is valid and differs from the reference.'}</p>
${L.auto ? `<details><summary>Reference vs calculated positions</summary><p class="note"><b>Reference (from tip${U}):</b> ${L.auto.before.map(q => f(q.tipMm)).join(' \u00b7 ')}. Negative values are beyond the tip.</p><p class="note"><b>Calculated:</b> ${L.guides.map(q => f(q.tipMm)).join(' \u00b7 ')}.</p></details>` : ''}`}
<div class="bar">${L.auto || !as.needed ? '<button class="btn sm" data-restoreref>Restore reference</button>' : ''}<button class="btn sm" data-fit>Set stem to ${f(g.suggestStemFromButtMm)}</button>${as.needed && K.compressionAvailable(L) ? `<button class="btn sm" data-prev>${S.prev ? 'Hide' : 'Preview'} runner-gap scaling</button>` : ''}${pv ? '<button class="btn sm pri" data-compress>Apply scaling (experimental)</button>' : ''}</div>
${pv ? `<p class="note">Experimental, not Fuji\u2019s method: runner gaps scaled by ${pv.k.toFixed(3)}, smallest gap ${f(pv.minGapMm)}. #1\u2013#4 stay put.</p>` : ''}</section>`}
<section class="card s-dia"><h2>Layout from the tip</h2>${svg(g, pv, cv)}<div class="legend">${Object.keys(ROLE).map(k => `<span><i class="dot r-${k}"></i>${ROLE_NAME[k]}</span>`).join('')}</div><p class="note">Tip on the right. Ring size is drawn to relative scale. Heights show role order only; they are not frame dimensions, because verified manufacturer heights aren\u2019t held.</p></section>
<section class="card s-sum"><h2>KR layout</h2><div class="sumrow">${(() => { const gs = L.guides, ci = gs.findIndex(q => q.role === 'choke'), red = gs.filter(q => q.role === 'stripper' || q.role === 'reduction'), run = gs.filter(q => q.role === 'running'), idx = q => gs.indexOf(q), bs = q => `<i class="tag ${q.basis}">${BASIS[q.basis] || q.basis}</i>`;
  const line = (cls, name, q, extra) => `<div class="sl"><span class="dot r-${cls}"></span><b>${name}</b><span>${extra}</span></div>`;
  const at = q => `${K.label(L, idx(q))} \u00b7 ${f(K.fromStem(L, idx(q)))} from stem \u00b7 ${f(q.tipMm)} from tip`;
  return line('stripper', 'Stripper', gs[0], `${gs[0].model} \u00b7 ${at(gs[0])} ${bs(gs[0])}`)
    + `<div class="sl"><span class="dot r-reduction"></span><b>Reduction train</b><span>${red.map(q => q.model).join(' \u00b7 ')}${gs[2] && gs[2].unverified ? ' (third guide unverified)' : ''}</span></div>`
    + (ci >= 0 ? line('choke', 'Choke point', gs[ci], `${gs[ci].model} \u00b7 ${at(gs[ci])} ${bs(gs[ci])}`) : '')
    + `<div class="sl"><span class="dot r-running"></span><b>Running guides</b><span>${run.length} \u00b7 spacing ${run.length ? f(Math.min(...gs.slice(ci).map((q, k, a) => (k ? a[k - 1].tipMm - q.tipMm : Infinity)))) + '\u2013' + f(Math.max(...gs.slice(ci).map((q, k, a) => (k ? a[k - 1].tipMm - q.tipMm : 0)))) + U : '\u2014'} (choke to tip-top)</span></div>`; })()}</div>
<p class="note">Tags: <b>reference</b> = the chart\u2019s own distance, <b>calculated</b> = placed by K-Labs, <b>adjusted</b> = moved by you.</p></section>
<section class="card s-src"><h2>Sources and limits</h2><p class="mut">Reference: ${S.ref.chart ? 'Fuji KR Concept chart row for ' + esc(S.rod) : 'the spacing between guides in your chart' + (S.ref.label ? ' (\u201c' + esc(S.ref.label) + '\u201d)' : '')}. The chart\u2019s choke-distance table is kept as a separate cross-check, never combined with the spacing${x ? ': ' + f(x.tableMm) + ' vs ' + f(x.chainMm) + ' from the stem' + (x.agrees ? ', in agreement' : ', ' + f(x.deltaMm) + ' apart. This layout uses the spacing diagram') : ''}.</p>
<details id="entrybox"${S.entryMsg || !S.ref.chart || S.entryOpen ? ' open' : ''}><summary>Other rod: enter your own measurements</summary>
<p class="note">For a rod not in the chart, type the distances from your own chart. They are not saved or sent anywhere; enter them again next time.</p>
<div class="grid"><label class="f">Label (optional)<input class="tin" data-e="label" value="${esc(S.entry.label)}" autocomplete="off" maxlength="60"></label><label class="f">Reel stem to first guide (${un})<input class="tin" data-e="stripper" inputmode="decimal" value="${esc(S.entry.stripper)}" autocomplete="off"></label></div>
<label class="f">Gaps from guide #1 toward the tip-top, in order (${un}), separated by spaces or commas<input class="tin" data-e="gaps" inputmode="decimal" value="${esc(S.entry.gaps)}" autocomplete="off" placeholder="one gap per guide after the first"></label>
<p class="note">The first gap is #1 to #2, and the last gap ends at the tip-top. Roles are assumed in this order: stripper, two more reduction guides, choke guide, running guides, tip-top (at least 5 guides).</p>
<label class="f">Guide models, optional (one per guide, same order, separated by commas)<input class="tin" data-e="models" value="${esc(S.entry.models)}" autocomplete="off"></label>
<div class="grid"><label class="f">Choke distance from the stem, optional cross-check (${un})<input class="tin" data-e="chokeBeyond" inputmode="decimal" value="${esc(S.entry.chokeBeyond)}" autocomplete="off"></label><span></span></div>
<div class="grid"><label class="f">Smallest runner gap in your chart, optional (${un})<input class="tin" data-e="envMin" inputmode="decimal" value="${esc(S.entry.envMin)}" autocomplete="off"></label><label class="f">Largest runner gap in your chart, optional (${un})<input class="tin" data-e="envMax" inputmode="decimal" value="${esc(S.entry.envMax)}" autocomplete="off"></label></div>
<p class="note">The smallest and largest runner gap let the tool judge a different guide count against your chart. Leave them blank and it uses the range of this rod&rsquo;s own gaps. The choke distance is only used to flag a disagreement with the spacing you entered.</p>
${S.entryMsg ? `<p class="err">${esc(S.entryMsg)}</p>` : ''}
<div class="bar"><button class="btn sm pri" data-applyentry>Use my measurements</button>${S.ref.chart ? '' : '<button class="btn sm" data-usedemo>Back to chart rod</button>'}</div>
<p class="note">${esc(S.ref.source)}</p>
<details><summary>Advanced: reference as JSON</summary><textarea id="refjson" spellcheck="false" aria-label="Reference data JSON">${JSON.stringify(S.ref, null, 1).replace(/</g, '&lt;')}</textarea>
<div class="bar"><button class="btn sm" data-applyref>Apply values</button></div></details></details></section></div>
<details class="about col-all"><summary>About this calculator</summary>
<p class="note">KR Guide Layout is an independent K-Labs Studio tool. It is not affiliated with or endorsed by Fuji; manufacturer names are used descriptively.${S.ref.chart ? ' The reference distances are Fuji\u2019s published KR Concept chart values, transcribed by K-Labs and not changed. The layout, guide counts, fit checks and scaling built on them are K-Labs calculations, not Fuji specifications.' : ' The reference distances are the measurements you typed in.'}</p>
<p class="note"><b>Assumptions and limits.</b> Positions are ring centres measured from the blank tip (ring offset assumed 0), so do not use them to mark foot placement. The ${K.len(K.MIN_GAP)} minimum clearance is a working assumption. Layouts are starting points and have not been bench, static-load or casting tested.</p>
<p class="note"><b>Unverified.</b> ${S.ref.chart ? 'The frame designation of the third reduction guide. ' : ''}Whether the chart measures to the ring centre or the ring base, and whether its rod length is the blank or the finished rod.</p>
<p class="note">Workshop prototype for internal testing.</p></details>`;
  }
  const A = document;
  A.addEventListener('click', e => {
    const b = e.target.closest('button,[data-i]'); if (!b) return; const d = b.dataset; if (d.resetall == null) S.confirm = false;
    if (d.st) { const k = d.k, cur = val(k) == null ? 0 : val(k); apply(k, cur + (+d.st) * step()); }
    else if (d.unit) { if (d.unit !== S.unit) { convertEntry(S.unit, d.unit); S.unit = d.unit; K.setUnit(S.unit); S.msg = ''; } }
    else if (d.lock != null) K.toggleLock(L, +d.lock);
    else if (d.reset != null) { const r = K.resetGuide(L, +d.reset); S.msg = r.ok ? '' : r.msg; }
    else if (d.resetall != null) { if (!S.confirm) S.confirm = true; else { L = K.resetAll(L); S.proposal = K.propose(L); S.cand = S.proposal.status === 'proposed' ? S.proposal.n : null; S.msg = ''; S.prev = false; S.confirm = false; } }
    else if (d.restoreref != null) { L = K.resetAll(L); S.proposal = K.propose(L); S.cand = S.proposal.status === 'proposed' ? S.proposal.n : null; S.msg = ''; S.prev = false; }
    else if (d.cand) S.cand = +d.cand;
    else if (d.candcancel != null) S.cand = null;
    else if (d.candapply != null) { const r = K.applyCandidate(L, S.cand, { acknowledgeReview: true }); S.msg = r.ok ? '' : r.msg; S.cand = null; S.sel = Math.min(S.sel, L.guides.length - 1); }
    else if (d.train) { K.applyTrain(L, d.train); S.train = d.train; }
    else if (d.fit != null) { S.stem = L.geom.bladeLenMm - L.refTotalMm; rebuild(); }
    else if (d.prev != null) S.prev = !S.prev;
    else if (d.compress != null) { const r = K.applyCompression(L); S.msg = r.ok ? '' : r.msg; S.prev = false; }
    else if (d.cnt) { const r = +d.cnt > 0 ? K.addGuide(L) : K.removeGuide(L); S.msg = r.ok ? '' : r.msg; }
    else if (d.applyentry != null) { const E = S.entry, parseU = v => { const m = K.parseLength(v, S.unit); return isFinite(m) ? m : NaN; }, list = listU;
      const gaps = list(E.gaps).map(parseU), one = v => (String(v).trim() === '' ? null : parseU(v));
      if (gaps.some(g => !isFinite(g)) || !isFinite(parseU(E.stripper))) S.entryMsg = 'Check the numbers: use plain decimals' + (S.unit === 'frac' ? ' or fractions such as 5 1/2' : '') + ' separated by spaces or commas.';
      else { const r = K.referenceFromEntry({ label: E.label, unit: 'mm', stripper: parseU(E.stripper), gaps, models: E.models.trim() ? E.models.split(',') : [], chokeBeyond: one(E.chokeBeyond), envelopeMin: one(E.envMin), envelopeMax: one(E.envMax) });
        if (!r.ok) S.entryMsg = r.msg; else { S.ref = r.ref; S.train = null; S.entryMsg = ''; build(); S.msg = ''; } } }
    else if (d.usedemo != null) { pickRod(S.rod); build(); S.msg = ''; }
    else if (d.rod != null) { pickRod(d.rod); build(); S.msg = ''; S.sel = 0; }
    else if (d.applyref != null) { try { const r = JSON.parse($('#refjson').value);
        if (!r.guides || r.gapsIn.length !== r.guides.length - 1) throw new Error('gapsIn must have one entry fewer than guides'); S.ref = r; build(); S.msg = ''; } catch (er) { S.msg = 'Reference values: ' + er.message; } }
    else if (d.i != null && !e.target.closest('input')) S.sel = +d.i; else return;
    render();
  });
  A.addEventListener('toggle', e => { if (e.target.id === 'entrybox') S.entryOpen = e.target.open; }, true); // keep the entry form open across unit changes
  A.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.e) S.entry[t.dataset.e] = t.value; });
  A.addEventListener('change', e => { const t = e.target;
    if (t.dataset.done) { S.done[t.dataset.done] = t.checked; }
    else if (t.dataset.k) { const k = t.dataset.k; apply(k, t.value.trim() === '' && (k === 'axle' || k === 'spool') ? NaN : parse(t.value)); if (k[0] === 'g') S.sel = +k.slice(1); }
    else return; render(); });
  A.addEventListener('focusin', e => { const r = e.target.closest('.row'); if (r && +r.dataset.i !== S.sel) { S.sel = +r.dataset.i; } });
  build(); render();
})();

</script></body></html>
