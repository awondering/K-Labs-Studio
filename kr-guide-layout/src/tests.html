<!doctype html><meta charset="utf-8"><title>KR engine tests</title>
<body style="background:#050606;color:#c9ced1;font:14px system-ui;padding:16px"><h3>KR engine tests</h3><pre id="o"></pre>
<script src="engine.js"></script><script src="tests.js"></script>
<script>const r=KR_TESTS;o.textContent=r.map(x=>(x.ok?'PASS ':'FAIL ')+x.name+(x.msg?' :: '+x.msg:'')).join('\n')+'\n\n'+r.filter(x=>x.ok).length+'/'+r.length+' passed'</script></body>
